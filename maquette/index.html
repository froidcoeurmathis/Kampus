<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kampus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23fff'/%3E%3Cpath d='M9 44C9 30 20 23 33 23s23 7 23 21c0 8-10 13-23 13S9 52 9 44Z' fill='%235FA4B0'/%3E%3Cpath d='M32 7 57 16 32 25 7 16Z' fill='%2300373E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* Couleurs inspirées du site de l'ULiège */
  :root {
    --teal: #00707F;
    --teal-dark: #00373E;
    --teal-mid: #005A66;
    --teal-light: #5FA4B0;
    --teal-soft: #E5F1F2;
    --beige: #C6C0B4;
    --sand: #E6E6E1;
    --bg: #F4F4F1;
    --card: #FFFFFF;
    --text: #4A4A4A;
    --title: #222222;
    --muted: #8C8B82;
    --line: #E6E6E1;
    --fluo: rgba(255, 226, 60, .55);
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Source Sans 3", "Source Sans Pro", -apple-system, "Segoe UI", sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, h3 { color: var(--title); }
  [hidden] { display: none !important; }
  .ic { flex: none; vertical-align: -3px; }

  /* ---------- Bandeau du haut ---------- */
  header.top {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 24px; color: #fff;
    background:
      linear-gradient(120deg, transparent 0 66%, rgba(0,112,127,.55) 66% 80%, rgba(95,164,176,.35) 80%),
      var(--teal-dark);
  }
  .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 900; font-size: 23px; letter-spacing: .3px; white-space: nowrap; }
  .mascot { width: 32px; height: 32px; flex: none; display: block; }
  .top-search { flex: 1; min-width: 200px; max-width: 560px; position: relative; }
  .top-search .ic.lead { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--teal); pointer-events: none; }
  .top-search input { width: 100%; padding: 9px 14px 9px 38px; border: 0; border-radius: var(--radius); background: rgba(255,255,255,.96); color: var(--title); }
  .top-search input:focus { outline: 3px solid var(--teal-light); }
  .top-right { display: flex; align-items: center; gap: 12px; font-size: 14px; margin-left: auto; }
  .btn-top { position: relative; display: inline-flex; align-items: center; gap: 6px; background: transparent; border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: var(--radius); padding: 5px 12px; font-size: 14px; white-space: nowrap; }
  .btn-top:hover { background: rgba(255,255,255,.12); }
  .btn-top .dot { position: absolute; top: -7px; right: -7px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--teal); font-size: 12px; font-weight: 900; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--teal-dark); }
  .who-label { display: flex; align-items: center; gap: 6px; }

  /* Résultats de recherche */
  .sr { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #fff; color: var(--text); border-radius: var(--radius); box-shadow: 0 14px 40px rgba(0,0,0,.25); max-height: 70vh; overflow-y: auto; z-index: 40; text-align: left; }
  .sr .sr-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 10px 14px 4px; }
  .sr button { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 8px 14px; }
  .sr button:hover, .sr button.on { background: var(--teal-soft); }
  .sr .l { font-weight: 600; color: var(--title); }
  .sr .s { font-size: 13px; color: var(--muted); }
  .sr .ic { color: var(--teal); }
  .sr .none { padding: 14px; color: var(--muted); }
  .sr mark { background: var(--fluo); color: inherit; border-radius: 2px; }

  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 80px; }

  /* ---------- Flèche retour + fil d'Ariane ---------- */
  .nav-line { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; margin-bottom: 14px; }
  .back { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--teal); padding: 0; }
  .back:hover { background: var(--teal-soft); border-color: var(--teal-light); }
  .crumbs { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; font-size: 14px; color: var(--muted); min-width: 0; }
  .crumbs a { color: var(--teal); cursor: pointer; text-decoration: none; font-weight: 600; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--beige); }

  .page-title { margin-bottom: 18px; }
  h1 { font-size: 30px; font-weight: 900; margin: 0; line-height: 1.15; }
  .sub { color: var(--muted); margin: 4px 0 0; }
  .eyebrow { text-transform: uppercase; letter-spacing: 1px; font-size: 12px; font-weight: 700; color: var(--teal); margin-bottom: 4px; }

  /* Accueil */
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 24px; margin-bottom: 22px; display: flex; gap: 22px; align-items: center; }
  .hero .mascot { width: 60px; height: 60px; }
  .hero h1 { font-size: 28px; }
  .hero .top-search { max-width: none; margin-top: 12px; }
  .hero .top-search input { border: 2px solid var(--teal-light); padding: 12px 14px 12px 40px; font-size: 17px; }

  /* ---------- Tuiles ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .tile { position: relative; overflow: hidden; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; cursor: pointer; transition: box-shadow .15s, transform .15s; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal); opacity: 0; transition: opacity .15s; }
  .tile:hover { box-shadow: 0 6px 18px rgba(0,55,62,.10); transform: translateY(-2px); }
  .tile:hover::before { opacity: 1; }
  .tile .badge-ic { width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
  .tile .name { font-weight: 700; color: var(--title); margin-top: 12px; font-size: 17px; line-height: 1.25; }
  .tile .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* ---------- Listes ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
  .search:focus, textarea:focus, select:focus, .field:focus { outline: 2px solid var(--teal-light); outline-offset: -1px; }
  select.sel { border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 10px; background: #fff; font-size: 15px; }
  .group-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; margin: 20px 0 8px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--teal-soft); }
  .row .rname { font-weight: 600; color: var(--title); }
  .row .rmeta { font-size: 13px; color: var(--muted); }
  .row .grow { flex: 1; min-width: 0; }
  .row .chev { color: var(--beige); }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--sand); color: var(--text); white-space: nowrap; }
  .badge.teal { background: var(--teal-soft); color: var(--teal); }
  .badge.year { background: #F1EEE8; color: #6E6656; }
  .empty { padding: 30px 20px; text-align: center; color: var(--muted); }
  .source { font-size: 13px; color: var(--muted); margin-top: 18px; }
  .source a { color: var(--teal); }

  .btn { display: inline-flex; align-items: center; gap: 6px; background: var(--teal); color: #fff; border: 0; border-radius: var(--radius); padding: 9px 16px; font-weight: 700; white-space: nowrap; }
  .btn:hover { background: var(--teal-mid); }
  .btn.ghost { background: var(--teal-soft); color: var(--teal); }
  .btn.ghost:hover { background: #d4e8ea; }
  .btn.small { padding: 5px 11px; font-size: 14px; }
  .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }

  /* Noms cliquables (message privé) */
  .person { cursor: pointer; text-decoration: underline dotted var(--beige); text-underline-offset: 3px; }
  .person:hover { color: var(--teal) !important; text-decoration-color: var(--teal); }
  .av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
  .av.sm { width: 24px; height: 24px; font-size: 10px; }

  /* ---------- Connexion ---------- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(120deg, transparent 0 55%, rgba(0,112,127,.6) 55% 75%, rgba(95,164,176,.4) 75%), var(--teal-dark); }
  .login { width: 100%; max-width: 400px; background: var(--card); border-radius: var(--radius); padding: 30px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .login .brand { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--teal-dark); font-weight: 900; font-size: 30px; }
  .login .brand .mascot { width: 60px; height: 60px; }
  .login .sub { text-align: center; margin-bottom: 14px; }
  .login label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; color: var(--title); }
  .login .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 12px; font-size: 16px; }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: 14px; }

  /* ---------- Page d'un cours ---------- */
  .shared { background: var(--teal-soft); border: 1px solid #cfe3e5; border-radius: var(--radius); padding: 8px 12px; margin-top: 10px; font-size: 14px; color: var(--teal-dark); }
  .shared summary { cursor: pointer; font-weight: 600; }
  .shared ul { margin: 8px 0 2px; padding-left: 20px; max-height: 180px; overflow-y: auto; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-head h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .panel-head small { color: var(--muted); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 0 8px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 13px 12px 11px; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; }
  .tab:hover { color: var(--teal); }
  .tab.on { color: var(--teal); border-bottom-color: var(--teal); }
  .tab .count { font-size: 12px; background: var(--sand); color: var(--text); border-radius: 10px; padding: 0 7px; }
  .tab.on .count { background: var(--teal); color: #fff; }
  .tab.chat-tab { margin-right: 10px; }
  .tab.chat-tab::after { content: ""; width: 1px; height: 22px; background: var(--line); margin-left: 14px; }
  .ftools { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #FAFAF8; }
  .filter-note { padding: 8px 16px; font-size: 13px; color: var(--teal-dark); background: var(--teal-soft); border-bottom: 1px solid var(--line); }
  .filter-note button { border: 0; background: none; color: var(--teal); font-weight: 700; text-decoration: underline; padding: 0; }

  .file { display: grid; grid-template-columns: 36px minmax(0, 1fr) 190px auto; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .file:first-child { border-top: 0; }
  .file:hover { background: #FAFAF8; }
  .file .ficon { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--teal-soft); color: var(--teal); }
  .file .fname { font-weight: 700; color: var(--title); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .fname:hover { color: var(--teal); text-decoration: underline; }
  .file .fmeta { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .by { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .by small { display: block; font-size: 11px; color: var(--muted); line-height: 1.1; }
  .by b { display: block; font-size: 14px; color: var(--title); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-row { padding: 9px 16px 5px; background: #FAFAF8; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--title); font-size: 14px; }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 4px; border: 2px dashed var(--beige); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--muted); margin: 12px 16px 16px; font-size: 15px; }
  .drop .ic { color: var(--teal-light); }
  .drop.over { border-color: var(--teal); background: var(--teal-soft); color: var(--teal); }
  .drop label.pick { color: var(--teal); cursor: pointer; font-weight: 700; }

  /* ---------- Étoiles (notes de 1 à 5) ---------- */
  .stars { display: inline-flex; align-items: center; gap: 1px; }
  .stars .ic { color: var(--beige); }
  .stars .ic.on { color: #E0A800; fill: #E0A800; }
  .rating { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); }
  .rating b { color: var(--title); }
  .rate-inline { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .rate-inline b { color: var(--title); }
  .rate { display: inline-flex; flex-direction: row-reverse; vertical-align: middle; }
  .rate button { border: 0; background: none; padding: 0 1px; color: var(--beige); line-height: 0; }
  .rate button .ic { width: 16px; height: 16px; }
  .rate button.on, .rate button.on .ic { color: #E0A800; fill: #E0A800; }
  .rate:hover button .ic { color: var(--beige); fill: none; }
  .rate button:hover .ic, .rate button:hover ~ button .ic { color: #E0A800 !important; fill: #E0A800 !important; }

  /* ---------- Chat général du cours ---------- */
  .chat { display: flex; flex-direction: column; height: calc(100vh - 290px); min-height: 440px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 8px; max-width: 80%; }
  .msg .body { min-width: 0; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg .who b { color: var(--title); }
  .msg .bubble { background: var(--bg); padding: 8px 11px; border-radius: 0 10px 10px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg.me .who { text-align: right; }
  .msg.me .bubble { background: var(--teal); color: #fff; border-radius: 10px 0 10px 10px; }
  .ref { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-size: 13px; font-weight: 600; background: #fff; color: var(--teal); border: 1px solid var(--teal-light); border-radius: 5px; padding: 3px 8px; margin-bottom: 6px; cursor: pointer; text-align: left; }
  .ref span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ref:hover { background: var(--teal-soft); }
  .msg.me .ref { background: rgba(255,255,255,.15); color: #fff; border-color: rgba(255,255,255,.5); }
  .composer { border-top: 1px solid var(--line); padding: 10px; }
  .draft { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; }
  .draft .ref { margin: 0; cursor: default; background: #FFF8D6; border-color: #E8CF5A; color: #6E5200; }
  .composer .line { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; height: 44px; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); }
  .icon-btn { display: grid; place-items: center; border: 1px solid var(--line); background: #fff; color: var(--teal); border-radius: var(--radius); height: 44px; width: 44px; flex: none; }
  .icon-btn:hover, .icon-btn.on { border-color: var(--teal-light); background: var(--teal-soft); }
  .x { border: 0; background: none; color: var(--muted); padding: 0 4px; display: grid; place-items: center; }
  .picker { border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; max-height: 220px; overflow-y: auto; background: #fff; }
  .picker .ptitle { font-size: 12px; color: var(--muted); padding: 7px 10px 3px; }
  .picker button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; font-size: 14px; }
  .picker button .ic { color: var(--teal); }
  .picker button:hover { background: var(--teal-soft); color: var(--teal); }

  /* ---------- Visionneuse de document ---------- */
  .viewer-bg { position: fixed; inset: 0; background: rgba(0,30,34,.65); z-index: 50; display: flex; padding: 18px; }
  .viewer { margin: auto; width: 100%; max-width: 1300px; height: 100%; background: var(--bg); border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden; }
  .vhead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .vhead .grow { flex: 1; min-width: 200px; }
  .vhead h3 { margin: 0; font-size: 17px; }
  .vbody { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .vbody .chat { height: auto; min-height: 0; border: 0; border-left: 1px solid var(--line); border-radius: 0; }
  .vbody .msg { max-width: 94%; }
  .pages { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .pin-help { position: sticky; top: 0; z-index: 3; background: var(--teal-dark); color: #fff; padding: 8px 14px; border-radius: var(--radius); font-size: 14px; }
  .sheet { position: relative; width: 100%; max-width: 660px; aspect-ratio: 1 / 1.3; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); padding: 7% 8%; font-size: 14px; color: #333; overflow: hidden; flex: none; }
  .sheet.free { aspect-ratio: auto; min-height: 300px; padding: 20px; }
  .sheet .pnum { position: absolute; bottom: 12px; right: 18px; font-size: 12px; color: var(--muted); }
  .sheet h4 { margin: 0 0 12px; font-size: 19px; color: var(--teal-dark); }
  .sheet .q { position: relative; margin: 0 0 16px; padding: 6px 8px; border-radius: 4px; isolation: isolate; }
  .sheet .q b { color: var(--title); }
  .sheet .lines span { display: block; height: 8px; background: #ECECE8; border-radius: 4px; margin: 9px 0; }
  .sheet img { max-width: 100%; display: block; margin: auto; }
  .sheet iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .pages.selecting .sheet { cursor: crosshair; }
  .pages.selecting .sheet .q:hover { outline: 2px dashed var(--teal-light); }
  /* Le surligneur fluo : il passe une fois, reste ~3 s, puis s'efface */
  .q::before, .spot::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 4px; background: var(--fluo); transform: scaleX(0); transform-origin: left; opacity: 0; }
  .q.hl::before, .spot.hl::before { animation: fluo-in .7s ease-out forwards, fluo-out 1s ease 3.4s forwards; }
  .q.sel::before { transform: scaleX(1); opacity: .7; }
  @keyframes fluo-in { from { transform: scaleX(0); opacity: 1; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes fluo-out { from { transform: scaleX(1); opacity: 1; } to { transform: scaleX(1); opacity: 0; } }
  .spot { position: absolute; width: 22%; height: 7%; transform: translate(-50%, -50%); isolation: isolate; pointer-events: none; }

  /* ---------- Messages privés ---------- */
  .dm-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100%; background: var(--card); z-index: 70; box-shadow: -10px 0 40px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .dm-panel .panel-head { background: var(--teal-dark); color: #fff; }
  .dm-panel .panel-head h3 { color: #fff; }
  .dm-panel .panel-head button { background: none; border: 0; color: #fff; display: grid; place-items: center; padding: 2px; }
  .dm-row { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 12px 16px; }
  .dm-row:hover { background: var(--teal-soft); }

/* La mascotte : un petit requin avec son chapeau de diplômé */

/* ---------- petites aides ---------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
let uidN = Date.now();
const uid = () => "u" + (uidN++).toString(36);
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("on"), 2600); }
const MOIS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
function fmtDay(ts) { const d = new Date(ts); return `${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(ts) { const d = new Date(ts); return `${d.getDate()} ${MOIS[d.getMonth()]} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function sizeStr(b) { return b > 1e6 ? (b / 1e6).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(b / 1e3)) + " Ko"; }
const yearOf = (ts) => String(new Date(ts).getFullYear());   // l'année se met toute seule, selon la date d'ajout
const COLORS = ["#00707F", "#5B2C86", "#00843B", "#005CA9", "#940104", "#C25A16", "#5B57A2", "#8C6D00"];
function color(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function initials(name) { return name.replace(/\(.*?\)/g, "").trim().split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase(); }
function avatar(name, sm) { return `<span class="av ${sm ? "sm" : ""}" data-person="${esc(name)}" title="Écrire à ${esc(name)} en privé" style="background:${color(name)}">${esc(initials(name))}</span>`; }
const person = (name) => `<b class="person" data-person="${esc(name)}" title="Écrire à ${esc(name)} en privé">${esc(name)}</b>`;
function ext(name) { const m = /\.([a-z0-9]+)$/i.exec(name); return m ? m[1].toUpperCase() : "Fichier"; }
/* Notes : chaque personne donne 1 à 5 étoiles, la moyenne fait les étoiles du document */
function ratingOf(f) { const v = Object.values(f.ratings || {}); return { avg: v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0, n: v.length }; }
const starsHTML = (avg, size = 14) => `<span class="stars" title="${avg ? avg.toFixed(1).replace(".", ",") + " sur 5" : "Pas encore noté"}">${[1, 2, 3, 4, 5].map((i) => icon("star", size, i <= Math.round(avg) ? "on" : "")).join("")}</span>`;
function ratingHTML(f) {
  const { avg, n } = ratingOf(f);
  return n ? `<span class="rating">${starsHTML(avg)} <b>${avg.toFixed(1).replace(".", ",")}</b> (${n} avis)</span>` : `<span class="rating">${starsHTML(0)} pas encore noté</span>`;
}

/* ---------- Index : quels programmes partagent quel cours ---------- */
const COURSE_INDEX = {};   // code -> { name, prof, uses: [{ path, pname, year }] }
SCHOOL.faculties.forEach((f) => f.programmes.forEach((p) => {
  Object.entries(p.courses || {}).forEach(([y, list]) => list.forEach((c) => {
    const e = COURSE_INDEX[c.code] || (COURSE_INDEX[c.code] = { name: c.name, prof: c.prof, uses: [] });
    if (!e.uses.some((u) => u.path[2] === p.id && u.year === y)) e.uses.push({ path: [SCHOOL.id, f.id, p.id, y], pname: p.name, year: y });
  }));
}));

/* ---------- Index de recherche rapide ---------- */
const SEARCH = [];
SCHOOL.faculties.forEach((f) => {
  SEARCH.push({ kind: "fac", ico: f.id, label: f.name, sub: "Faculté", path: [SCHOOL.id, f.id], n: norm(f.name) });
  f.programmes.forEach((p) => SEARCH.push({ kind: "prog", ico: "cap", label: p.name, sub: f.name, path: [SCHOOL.id, f.id, p.id], n: norm(p.name) }));
});
Object.entries(COURSE_INDEX).forEach(([code, c]) => SEARCH.push({
  kind: "course", ico: "cours", label: c.name,
  sub: `${code} · ${c.uses.length > 1 ? "commun à " + c.uses.length + " programmes" : c.uses[0].pname + " · " + c.uses[0].year}`,
  path: [...c.uses[0].path, code], n: norm(c.name + " " + code + " " + c.prof),
}));
function searchAll(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!toks.length) return [];
  const hits = SEARCH.filter((it) => toks.every((t) => it.n.includes(t)));
  const score = (it) => (norm(it.label).startsWith(toks[0]) ? 0 : norm(it.label).includes(" " + toks[0]) ? 1 : 2);
  const by = (k, n) => hits.filter((h) => h.kind === k).sort((a, b) => score(a) - score(b) || a.label.localeCompare(b.label, "fr")).slice(0, n);
  return [...by("prog", 8), ...by("fac", 4), ...by("course", 8)];
}
function highlightText(label, q) {
  let out = esc(label);
  norm(q).split(/\s+/).filter(Boolean).forEach((t) => {
    const i = norm(label).indexOf(t);
    if (i >= 0) { const part = label.slice(i, i + t.length); out = out.replace(esc(part), `<mark>${esc(part)}</mark>`); }
  });
  return out;
}

    dms: {

/* ---------- mémoire du navigateur ---------- */
const KEY = "kampus-maquette-v5";
function load() { try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify({ user: S.user, extra: S.extra })); } catch (e) {} }
const saved = load();
const HOME = [SCHOOL.id];
const S = {
  user: saved?.user || null,
  extra: saved?.extra || demoExtra(),
  path: [...HOME],   // [école, faculté, programme, année, code du cours]
  tab: "chat",

  fyear: "",         // filtre par année

  draftRef: null,    // passage d'un document attaché au message
  viewer: null,      // { fileId, selecting, hl }
  dm: null,          // null | "list" | nom de la personne
};

/* ---------- où suis-je ? ---------- */
function cur() {
  const [, f, p, y, c] = S.path;
  const fac = SCHOOL.faculties.find((x) => x.id === f);
  const prog = fac && fac.programmes.find((x) => x.id === p);
  const year = prog && y;
  const course = year && ((prog.courses || {})[year] || []).find((x) => x.code === c);
  return { fac, prog, year, course };
}
// Un cours = un seul espace, même s'il est partagé entre plusieurs programmes : on le range par son code officiel.
function courseKey() { return S.path[4]; }
function filesOf(key) { return S.extra.files[key] || (S.extra.files[key] = []); }
function msgsOf(key) { return S.extra.msgs[key] || (S.extra.msgs[key] = []); }
function go(depth, id) {
  depth = Math.max(1, depth);
  S.path = S.path.slice(0, depth); if (id) S.path.push(id);
  resetCourseUI(); render(); window.scrollTo(0, 0);
}
function goPath(path) { S.path = [...path]; resetCourseUI(); render(); window.scrollTo(0, 0); }
function resetCourseUI() { S.pickerOpen = false; S.fq = ""; S.fyear = ""; S.draft = ""; S.draftRef = null; S.tab = "chat"; }
const unread = (name) => (S.extra.dms[name] || []).filter((m) => m.from !== S.user?.name && !m.read).length;

}

function bindChat(ctx) {
  const ci = $(`#${ctx}-input`), cf = $(`#${ctx}-form`);
  if (!cf) return;
  ci.oninput = () => (S.draft = ci.value);
  ci.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); cf.requestSubmit(); } };
  cf.onsubmit = (e) => {
    e.preventDefault();
    const text = ci.value.trim(); if (!text) return;
    const key = courseKey();
    msgsOf(key).push({ id: uid(), author: S.user.name, text, ts: Date.now(), ...(S.draftRef ? { ref: S.draftRef } : {}) });
    S.draft = ""; S.draftRef = null; save();
    if (S.viewer) renderViewer(); else render();
    fakeReply(key);
  };
  const ms = $(`#${ctx}-msgs`); if (ms) ms.scrollTop = ms.scrollHeight;
}

function filesPanel(files) {
  const filtered = files.filter(fileMatches);
  const cat = catOf(S.tab);
  const list = filtered.filter((f) => f.cat === S.tab);
  const sorters = { recent: (a, b) => b.ts - a.ts, az: (a, b) => a.name.localeCompare(b.name, "fr"), author: (a, b) => a.author.localeCompare(b.author, "fr") || b.ts - a.ts, year: (a, b) => b.ts - a.ts,
    best: (a, b) => ratingOf(b).avg - ratingOf(a).avg || ratingOf(b).n - ratingOf(a).n };
  list.sort(sorters[S.sort]);
  let body;
  if (!list.length) {
    const elsewhere = filtered.length && (S.fq || S.fyear) ? CATS.filter((c) => c.id !== S.tab && filtered.some((f) => f.cat === c.id)).map((c) => `<button class="btn ghost small" data-tab="${c.id}">${icon(c.id, 15)} ${c.label} (${filtered.filter((f) => f.cat === c.id).length})</button>`).join(" ") : "";
    body = `<div class="empty">${S.fq || S.fyear ? "Rien ne correspond dans cet onglet." : `Pas encore de documents dans « ${cat.label} ».<br>Sois le premier à en ajouter !`}${elsewhere ? `<br><br>Mais il y a des résultats ici : ${elsewhere}` : ""}</div>`;
  } else if (S.sort === "author" || S.sort === "year") {
    const key = S.sort === "author" ? (f) => f.author : (f) => yearOf(f.ts);
    const groups = [];
    list.forEach((f) => { const k = key(f); const g = groups.find((x) => x.k === k); g ? g.items.push(f) : groups.push({ k, items: [f] }); });
    body = groups.map((g) => `<div class="group-row">${S.sort === "author" ? avatar(g.k, true) + " " + person(g.k) : icon("calendar", 16) + " " + esc(g.k)} <span class="badge">${g.items.length}</span></div>${g.items.map(fileRow).join("")}`).join("");
  } else body = list.map(fileRow).join("");

  const years = [...new Set(files.map((f) => yearOf(f.ts)))].sort().reverse();
  const yearCount = (y) => files.filter((f) => yearOf(f.ts) === y && (!S.fq || norm(f.author + " " + f.name).includes(norm(S.fq)))).length;
  const note = S.fq || S.fyear ? `<div class="filter-note">Filtre actif : ${S.fq ? `« ${esc(S.fq)} »` : ""}${S.fq && S.fyear ? " · " : ""}${S.fyear ? esc(S.fyear) : ""} — <button id="clearFilters">tout afficher</button></div>` : "";
  return `<div class="ftools">
      <div class="search-wrap">${icon("search", 17)}<input class="search" id="fsearch" placeholder="Chercher une personne ou un fichier (ex : Noémie)" value="${esc(S.fq)}"></div>
      <select class="sel" id="fyear" title="Année"><option value="">Toutes les années</option>${years.map((y) => `<option value="${y}" ${S.fyear === y ? "selected" : ""}>${y} (${yearCount(y)})</option>`).join("")}</select>
      <select class="sel" id="sort" title="Trier">
        <option value="recent" ${S.sort === "recent" ? "selected" : ""}>Plus récents d'abord</option>
        <option value="best" ${S.sort === "best" ? "selected" : ""}>Mieux notés d'abord</option>
        <option value="year" ${S.sort === "year" ? "selected" : ""}>Rangés par année</option>
        <option value="author" ${S.sort === "author" ? "selected" : ""}>Rangés par personne</option>
        <option value="az" ${S.sort === "az" ? "selected" : ""}>Nom (A → Z)</option>
      </select>
    </div>
    ${note}
    <div>${body}</div>
    <div class="drop" id="drop">${icon("upload", 26)}<div>Glisse tes fichiers ici ou <label class="pick">choisis-les<input type="file" id="fileInput" multiple hidden></label></div>
      <small>Ils seront rangés dans « ${cat.label} », avec ton nom et l'année ${yearOf(Date.now())}.</small></div>`;
}
function viewCourse() {

/* ---------- Visionneuse : le document + le chat général ---------- */
function fakePages(f) {
  const L = (n) => `<div class="lines">${Array.from({ length: n }, (_, i) => `<span style="width:${70 + ((i * 37) % 30)}%"></span>`).join("")}</div>`;
  const title = f.name.replace(/\.[a-z0-9]+$/i, "");
  const z = (label, html) => `<div class="q" data-label="${esc(label)}">${html}</div>`;
  if (f.cat === "examens" || f.cat === "exercices") {
    const w = f.cat === "examens" ? "Question" : "Exercice";
    const q = (n, txt) => z(`${w} ${n}`, `<b>${w} ${n}.</b> ${txt}${L(2)}`);
    return [
      `<h4>${esc(title)}</h4>${q(1, "Calculez la valeur actuelle d'un flux de 1 000 € reçu dans 3 ans au taux de 4 %.")}${q(2, "Un placement de 5 000 € rapporte 3 % par an. Que vaut-il après 10 ans ? a) en annuel b) en mensuel.")}`,
      `${q(3, "Vous placez 1 000 € par an pendant 5 ans à 2 %. Quelle est la valeur finale ?")}${q(4, "Expliquez la différence entre taux nominal et taux effectif.")}${q(5, "Une obligation de nominal 100 € verse un coupon de 5 %…")}`,
    ];
  }
  const ch = (n, t, lines) => z(`Chapitre ${n} – ${t}`, `<b>Chapitre ${n} – ${t}</b>${L(lines)}`);
  if (f.cat === "syntheses") return [
    `<h4>${esc(title)}</h4>${ch(1, "Introduction", 3)}${z("Chapitre 2 – Capitalisation", `<b>Chapitre 2 – Capitalisation :</b> V<sub>n</sub> = V<sub>0</sub> × (1 + r)<sup>n</sup>${L(3)}`)}${ch(3, "Actualisation", 4)}`,
    `${ch(4, "Annuités", 5)}${ch(5, "Obligations", 5)}`,
  ];
  return [`<h4>${esc(title)}</h4>${ch(1, "Valeur temps", 4)}${ch(2, "Taux d'intérêt", 5)}`, `${ch(3, "Actualisation", 5)}${ch(4, "Exemples", 4)}`, `${ch(5, "Exercices du cours", 6)}`];
}
function viewerPages(f) {
  const url = blobs[f.id];
  if (url && f.type?.startsWith("image/")) return [`<img src="${url}" alt="">`];
  if (url && f.type === "application/pdf") return [{ pdf: url }];
  if (f.demo) return fakePages(f);
  return [`<h4>${esc(f.name)}</h4><p style="color:#8C8B82">Aperçu indisponible dans la maquette${url ? "" : " (le contenu n'est pas gardé après rechargement)"}. Dans la vraie version, le document s'affichera ici.</p>`];
}
function renderViewer() {
  const box = $("#modal");
  if (!S.viewer) { box.innerHTML = ""; document.body.style.overflow = ""; return; }
  document.body.style.overflow = "hidden";
  const f = filesOf(courseKey()).find((x) => x.id === S.viewer.fileId);
  if (!f) { S.viewer = null; return renderViewer(); }
  const v = S.viewer, pages = viewerPages(f);
  const pagesHTML = pages.map((p, i) => p.pdf
    ? `<div class="sheet free" data-page="${i + 1}" style="height:70vh"><iframe src="${p.pdf}"></iframe></div>
       <p style="font-size:13px;color:#8C8B82;max-width:640px;text-align:center">Dans la maquette, on ne peut pas encore surligner dans un vrai PDF. Ce sera possible dans la vraie version.</p>`
    : `<div class="sheet ${p.startsWith("<img") ? "free" : ""}" data-page="${i + 1}">${p}<div class="pnum">${i + 1} / ${pages.length}</div></div>`).join("");
  box.innerHTML = `<div class="viewer-bg" id="viewerBg"><div class="viewer">
    <div class="vhead">
      <div class="ficon" style="width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)">${icon(f.cat, 20)}</div>
      <div class="grow"><h3>${esc(f.name)}</h3><div class="by" style="margin-top:2px">${avatar(f.author, true)}<span style="font-size:14px">Ajouté par ${person(f.author).replace("<b ", '<b style="display:inline" ')} · <span class="badge year">${yearOf(f.ts)}</span> · ${esc(catOf(f.cat).label)}
        · <span class="rate-inline">${ratingOf(f).n ? `${starsHTML(ratingOf(f).avg)} <b>${ratingOf(f).avg.toFixed(1).replace(".", ",")}</b> · ` : ""}ta note :
        <span class="rate">${[5, 4, 3, 2, 1].map((n) => `<button type="button" data-rate="${n}" class="${(f.ratings || {})[S.user.name] >= n ? "on" : ""}" title="${n} étoile${n > 1 ? "s" : ""} sur 5">${icon("star", 16)}</button>`).join("")}</span></span></span></div></div>
      <button class="btn ghost" data-download="${f.id}" title="Télécharger">${icon("download", 17)} Télécharger</button>
      <button class="btn ${v.selecting ? "" : "ghost"}" id="selMode">${icon("marker", 17)} ${v.selecting ? "Clique sur la question ou le chapitre…" : "Poser une question sur un passage"}</button>
      <button class="btn ghost" id="closeViewer">${icon("close", 17)} Fermer</button>
    </div>
    <div class="vbody">
      <div class="pages ${v.selecting ? "selecting" : ""}" id="pages">${v.selecting ? `<div class="pin-help">Clique sur la question ou le chapitre qui te pose problème</div>` : ""}${pagesHTML}</div>
      ${chatHTML("v")}
    </div></div></div>`;
  if (S.draftRef && S.draftRef.fileId === f.id) { const z = zoneOf(S.draftRef); if (z) z.classList.add("sel"); }
  bindViewer(f);
  bindChat("v");
  if (v.hl) { const r = v.hl; v.hl = null; setTimeout(() => flash(r), 60); }
}
function zoneOf(ref) {
  const sheet = $(`#modal .sheet[data-page="${ref.page}"]`);
  if (!sheet) return null;
  return ref.zone ? [...sheet.querySelectorAll("[data-label]")].find((z) => z.dataset.label === ref.zone) : null;
}
// Le surligneur : passe une fois sur la question, reste ~3 s, puis s'efface
function flash(ref) {
  let el = zoneOf(ref);
  if (!el) {
    const sheet = $(`#modal .sheet[data-page="${ref.page}"]`); if (!sheet) return;
    el = document.createElement("div"); el.className = "spot"; el.style.left = (ref.x || 50) + "%"; el.style.top = (ref.y || 20) + "%"; sheet.appendChild(el);
  }
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("hl"); void el.offsetWidth; el.classList.add("hl");
  setTimeout(() => el.classList.remove("hl"), 4600);
}
function openViewer(fileId, ref, selecting) { S.viewer = { fileId, selecting: !!selecting, hl: ref || null }; S.pickerOpen = false; renderViewer(); }
function closeViewer() { S.viewer = null; renderViewer(); render(); }
function bindViewer(f) {
  $("#closeViewer").onclick = closeViewer;
  $("#viewerBg").onclick = (e) => { if (e.target.id === "viewerBg") closeViewer(); };
  $("#selMode").onclick = () => { S.viewer.selecting = !S.viewer.selecting; renderViewer(); };
  $$("[data-rate]").forEach((b) => b.onclick = () => {
    const n = +b.dataset.rate;
    (f.ratings = f.ratings || {})[S.user.name] = n;
    save(); renderViewer();
    toast(`Merci ! Tu as donné ${n} étoile${n > 1 ? "s" : ""} sur 5 à ce document`);
  });
  $$("#pages .sheet").forEach((sh) => sh.onclick = (e) => {
    if (!S.viewer.selecting || sh.querySelector("iframe")) return;
    const r = sh.getBoundingClientRect(), page = +sh.dataset.page;
    const zone = e.target.closest("[data-label]");
    S.draftRef = { fileId: f.id, page, zone: zone ? zone.dataset.label : null,
      x: Math.round(((e.clientX - r.left) / r.width) * 100), y: Math.round(((e.clientY - r.top) / r.height) * 100),
      label: zone ? `${zone.dataset.label} · page ${page}` : `Page ${page}` };
    S.viewer.selecting = false;
    renderViewer();
    $("#v-input").focus();
  });
}

/* ---------- Messages privés ---------- */
function openDM(name) { if (!name || name === S.user.name) return; S.dm = name; renderDM(); }
function renderDM() {
  const box = $("#dm");
  if (!S.dm) { box.innerHTML = ""; return; }
  if (S.dm === "list") {
    const convs = Object.entries(S.extra.dms).sort((a, b) => (b[1].at(-1)?.ts || 0) - (a[1].at(-1)?.ts || 0));
    box.innerHTML = `<div class="dm-panel"><div class="panel-head"><h3>${icon("mail", 19)} Messages privés</h3><button id="dmClose" title="Fermer">${icon("close", 20)}</button></div>
      <div style="overflow-y:auto;flex:1">${convs.length ? convs.map(([n, l]) => {
        const u = unread(n);
        return `<button class="dm-row ${u ? "unread" : ""}" data-dmopen="${esc(n)}">${avatar(n).replace("data-person", "data-x")}<div style="min-width:0;flex:1"><b class="nm">${esc(n)}</b><div class="last">${esc(l.at(-1)?.text || "")}</div></div>${u ? `<span class="new">${u} nouveau${u > 1 ? "x" : ""}</span>` : ""}</button>`;
      }).join("") : `<div class="empty">Aucune conversation.<br>Clique sur le nom d'une personne (dans le chat ou sur un fichier) pour lui écrire en privé.</div>`}</div>
      <div style="padding:12px 16px;font-size:13px;color:#8C8B82;border-top:1px solid var(--line)">Astuce : clique sur n'importe quel nom souligné pour lui écrire. Les messages pas encore lus sont en bleu.</div></div>`;
  } else {
    const list = S.extra.dms[S.dm] || [];
    list.forEach((m) => { if (m.from !== S.user.name) m.read = true; });   // ouvrir la conversation = messages lus
    save();
    box.innerHTML = `<div class="dm-panel"><div class="panel-head"><h3><button id="dmBack" title="Toutes les conversations">${icon("back", 20)}</button>${avatar(S.dm, true).replace("data-person", "data-x")} ${esc(S.dm)}</h3><button id="dmClose" title="Fermer">${icon("close", 20)}</button></div>
      <div class="msgs" id="dm-msgs">${list.length ? list.map((m) => {
        const me = m.from === S.user.name;
        return `<div class="msg ${me ? "me" : ""}" style="max-width:88%"><div class="body"><div class="who">${me ? "Toi" : esc(m.from)} · ${fmtTime(m.ts)}</div><div class="bubble">${esc(m.text)}</div></div></div>`;
      }).join("") : `<div class="empty">Écris ton premier message privé à ${esc(S.dm.split(" ")[0])}.<br>Seul·e ${esc(S.dm.split(" ")[0])} pourra le lire.</div>`}</div>
      <form class="composer" id="dm-form"><div class="line"><textarea id="dm-input" placeholder="Message privé à ${esc(S.dm)}…"></textarea><button class="btn">Envoyer</button></div></form></div>`;
    const inp = $("#dm-input"), form = $("#dm-form");
    inp.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } };
    form.onsubmit = (e) => {
      e.preventDefault(); const text = inp.value.trim(); if (!text) return;
      const who = S.dm;
      (S.extra.dms[who] = S.extra.dms[who] || []).push({ from: S.user.name, text, ts: Date.now(), read: true });
      save(); renderDM(); $("#dm-input").focus();
      setTimeout(() => {
        S.extra.dms[who].push({ from: who, text: "Oui, avec plaisir ! (réponse simulée)", ts: Date.now(), read: S.dm === who });
        save();
        if (S.dm === who || S.dm === "list") renderDM();
        if (!S.viewer) render(); // met à jour le compteur de messages non lus en haut
      }, 1600);
    };
    const ms = $("#dm-msgs"); ms.scrollTop = ms.scrollHeight;
    $("#dmBack").onclick = () => { S.dm = "list"; renderDM(); };
    setTimeout(() => inp.focus(), 0);
    if (!S.viewer) render();
  }
  $("#dmClose").onclick = () => { S.dm = null; renderDM(); render(); };
  $$("[data-dmopen]").forEach((b) => b.onclick = () => { S.dm = b.dataset.dmopen; renderDM(); });
}

/* ================================================================
   AFFICHAGE + CLICS
   ================================================================ */
function render() {
  const app = $("#app");
  const active = document.activeElement, aid = active?.id, pos = active?.selectionStart;
  if (!S.user) { app.innerHTML = viewLogin(); bind(); return; }
  const view = [null, viewHome, viewProgrammes, viewYears, viewCourses, viewCourse][S.path.length];
  app.innerHTML = header() + `<main>${view()}</main>`;
  bind();
  if (aid === "fsearch") { const el = $("#fsearch"); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }
}

function bindSearch(id) {
  const inp = $("#" + id), box = $("#" + id + "-r");
  if (!inp) return;
  let results = [], sel = 0;
  const KIND = { prog: "Programmes", fac: "Facultés", course: "Cours" };
  const draw = () => {
    if (!inp.value.trim()) { box.hidden = true; return; }
    results = searchAll(inp.value);
    let last = "";
    box.innerHTML = results.length ? results.map((r, i) => {
      const t = r.kind !== last ? `<div class="sr-title">${KIND[r.kind]}</div>` : ""; last = r.kind;
      return `${t}<button type="button" data-i="${i}" class="${i === sel ? "on" : ""}">${icon(r.ico, 18)}<span><div class="l">${highlightText(r.label, inp.value)}</div><div class="s">${esc(r.sub)}</div></span></button>`;
    }).join("") : `<div class="none">Rien trouvé pour « ${esc(inp.value)} ». Essaie un autre mot.</div>`;
    box.hidden = false;
    box.querySelectorAll("[data-i]").forEach((b) => b.onmousedown = (e) => { e.preventDefault(); goPath(results[+b.dataset.i].path); });
  };
  inp.oninput = () => { sel = 0; draw(); };
  inp.onfocus = draw;
  inp.onblur = () => setTimeout(() => (box.hidden = true), 120);
  inp.onkeydown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, results.length - 1); draw(); }
    if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
    if (e.key === "Enter" && results[sel]) { e.preventDefault(); goPath(results[sel].path); }
    if (e.key === "Escape") { inp.value = ""; box.hidden = true; inp.blur(); }
  };
}

function bind() {
  const lf = $("#loginForm");
  if (lf) lf.onsubmit = (e) => { e.preventDefault(); S.user = { name: $("#lname").value.trim() || "Moi", email: $("#lemail").value }; save(); render(); };

  $$("[data-go]").forEach((el) => el.onclick = () => go(+el.dataset.go));
  const bk = $("#back"); if (bk) bk.onclick = () => go(S.path.length - 1);
  $$("#app [data-open]").forEach((el) => el.onclick = () => go(S.path.length, el.dataset.open));
  $$("#app [data-tab]").forEach((el) => el.onclick = () => { S.tab = el.dataset.tab; S.pickerOpen = false; render(); });
  bindSearch("gs"); bindSearch("hs");

  const lo = $("#logout"); if (lo) lo.onclick = () => { S.user = null; S.path = [...HOME]; S.dm = null; renderDM(); save(); render(); };
  const od = $("#openDm"); if (od) od.onclick = () => { S.dm = "list"; renderDM(); };

  // filtre local (programmes / cours)
  const se = $("#search");
  if (se) se.oninput = () => {
    const q = norm(se.value.trim()); let any = false;
    $$("[data-group]").forEach((g) => {
      let vis = 0;
      g.querySelectorAll("[data-search]").forEach((r) => { const ok = r.dataset.search.includes(q); r.hidden = !ok; if (ok) vis++; });
      g.hidden = !vis; if (vis) any = true;
    });
    $("#noResult").hidden = any;
  };

  // fichiers
  const fs = $("#fsearch"); if (fs) fs.oninput = () => { S.fq = fs.value; render(); };
  const fy = $("#fyear"); if (fy) fy.onchange = () => { S.fyear = fy.value; render(); };
  const cfl = $("#clearFilters"); if (cfl) cfl.onclick = () => { S.fq = ""; S.fyear = ""; render(); };
  const so = $("#sort"); if (so) so.onchange = () => { S.sort = so.value; render(); };
  const fi = $("#fileInput"); if (fi) fi.onchange = () => addFiles(fi.files);
  const drop = $("#drop");
  if (drop) {
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
  }
  $$("#app [data-openfile]").forEach((el) => el.onclick = () => openViewer(el.dataset.openfile));

  // chat
  const pb = $("#pickBtn"); if (pb) pb.onclick = () => { S.pickerOpen = !S.pickerOpen; render(); };
  $$("[data-pickfile]").forEach((b) => b.onclick = () => openViewer(b.dataset.pickfile, null, true));
  bindChat("m");
}

// Clics « partout » : un nom → message privé ; une étiquette de passage → ouvrir le document à cet endroit
document.addEventListener("click", (e) => {
  const per = e.target.closest("[data-person]");
  if (per) { e.preventDefault(); e.stopPropagation(); openDM(per.dataset.person); return; }
  const ref = e.target.closest("[data-ref]");
  if (ref) {
    e.preventDefault(); e.stopPropagation();
    const m = msgsOf(courseKey()).find((x) => x.id === ref.dataset.ref);
    if (!m) return;
    if (S.viewer && S.viewer.fileId === m.ref.fileId) flash(m.ref);
    else openViewer(m.ref.fileId, m.ref);
    return;
  }
  const dl = e.target.closest("[data-download]");
  if (dl) { e.preventDefault(); e.stopPropagation(); downloadFile(dl.dataset.download); return; }
  if (e.target.closest("[data-cleardraft]")) {
    e.preventDefault(); S.draftRef = null;
    if (S.viewer) renderViewer(); else render();
  }
}, true);

// Télécharger un document. Dans la vraie version, le fichier viendra du stockage en ligne.
function downloadFile(id) {
  const f = filesOf(courseKey()).find((x) => x.id === id);
  if (!f) return;
  const a = document.createElement("a");
  if (blobs[f.id]) { a.href = blobs[f.id]; a.download = f.name; }
  else {
    // Les documents d'exemple n'ont pas de vrai contenu : on télécharge une petite fiche à la place
    const txt = `${f.name}\n\nDocument d'exemple de la maquette Kampus.\nAjouté par ${f.author} le ${fmtDay(f.ts)}.\n\nDans la vraie version, c'est le vrai fichier qui sera téléchargé.\n`;
    a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" }));
    a.download = f.name.replace(/\.[a-z0-9]+$/i, "") + " (exemple).txt";
  }
  document.body.appendChild(a); a.click(); a.remove();
  toast(`Téléchargement de « ${f.name} »`);
}

function addFiles(list) {
  const key = courseKey();
  [...list].forEach((file) => {
    const id = uid();
    filesOf(key).push({ id, cat: S.tab, name: file.name, author: S.user.name, ts: Date.now(), size: sizeStr(file.size), type: file.type });
    blobs[id] = URL.createObjectURL(file);
  });
  save(); render();
  toast(`${list.length} fichier${list.length > 1 ? "s" : ""} ajouté${list.length > 1 ? "s" : ""} dans « ${catOf(S.tab).label} »`);
}

// Un faux camarade répond, pour montrer à quoi ressemblera l'entraide
const REPLIES = [
  "Bonne question ! Je pense que c'est expliqué dans le chapitre 2.",
  "J'avais la même question, quelqu'un a la réponse ?",
  "Je regarde ce soir et je te dis.",
  "Le prof l'a expliqué au dernier cours, je mets mes notes dans « Cours » !",
];
function fakeReply(key) {
  setTimeout(() => {
    msgsOf(key).push({ id: uid(), author: "Camille Simon (réponse simulée)", text: REPLIES[Math.floor(Math.random() * REPLIES.length)], ts: Date.now() });
    save();
    if (courseKey() !== key) return;
    if (S.viewer) renderViewer(); else if (S.tab === "chat") render();
  }, 1800);
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.dm) { S.dm = null; renderDM(); render(); return; }
  if (S.viewer) closeViewer();
});

render();
</script>
